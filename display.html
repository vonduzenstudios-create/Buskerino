<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buskerino Stage</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage { display: grid; grid-template-columns: 1fr 34vw; height: 100vh; gap: 2vh; padding: 2vh; }
  .video {
    background: #000; border-radius: var(--radius); overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .video video, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  /* Scale the YouTube frame up slightly so its title bar and edges sit outside the box. */
  .video iframe { inset: -8% -8%; width: 116%; height: 116%; pointer-events: none; }
  .layer { position: absolute; inset: 0; overflow: hidden; opacity: 0; transition: opacity 1.2s ease; }
  .layer.on { opacity: 1; }
  .layer img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); font-size: 3vh; text-align: center; padding: 4vh;
  }
  .now {
    position: absolute; left: 2vh; bottom: 2vh; right: 2vh; background: rgba(0,0,0,.65);
    border-radius: 12px; padding: 1.5vh 2vh; font-size: 3.2vh; font-weight: 700; display: none;
  }
  .side { display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
  .list { background: var(--panel); border-radius: var(--radius); padding: 2vh; flex: 1; min-height: 0; overflow: hidden; }
  .list h2 { margin: 0 0 2vh; font-size: 3vh; color: var(--accent); }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2vh; }
  li { display: flex; gap: 2vh; align-items: center; }
  li .art {
    width: 18vh; height: 18vh; flex: none; border-radius: 10px; background: var(--panel-2);
    object-fit: cover; box-shadow: 0 0.6vh 1.6vh rgba(0,0,0,.4);
  }
  li .text { min-width: 0; }
  li .game { font-size: 2.1vh; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  li .song { font-size: 3.6vh; font-weight: 700; margin-top: .4vh; }
  li .game, li .song { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qr { background: var(--panel); border-radius: var(--radius); padding: 2vh; display: flex; gap: 2vh; align-items: center; }
  .qr .code { background: #fff; padding: 1vh; border-radius: 10px; line-height: 0; }
  .qr .code img { width: 18vh; height: 18vh; image-rendering: pixelated; }
  .qr .text { font-size: 2.6vh; font-weight: 700; }
  .qr .text small { display: block; font-weight: 400; font-size: 1.8vh; color: var(--muted); margin-top: .8vh; word-break: break-all; }
</style>
</head>
<body>
<div class="stage">
  <div class="video" id="video">
    <div class="layer" id="between">
      <div class="placeholder">BUSKERINO<br><small>Vote on your phone to pick the next song</small></div>
    </div>
    <div class="layer" id="player"></div>
    <div class="now" id="now"></div>
  </div>
  <div class="side">
    <div class="list">
      <h2>Up next</h2>
      <ol id="list"></ol>
    </div>
    <div class="qr">
      <div class="code" id="qr"></div>
      <div class="text">Scan to vote<small id="url"></small></div>
    </div>
  </div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module">
import { call, esc, watchShow, audienceUrl, configured, showSetupNeeded } from './js/app.js';

if (!configured) { showSetupNeeded(); throw new Error('not configured'); }

const url = audienceUrl();
const qr = qrcode(0, 'M');
qr.addData(url);
qr.make();
document.getElementById('qr').innerHTML = qr.createImgTag(6, 0);
document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');

// Game, song, art and video come from songs.json, so they can be changed by editing that file.
const info = {};
try {
  const { songs } = await (await fetch('songs.json', { cache: 'no-store' })).json();
  for (const s of songs) info[s.id] = s;
} catch (e) { console.error(e); }
const videos = {};
for (const s of Object.values(info)) if (s.video) videos[s.id] = s.video;

function youtubeId(link) {
  let u;
  try { u = new URL(link); } catch { return null; }
  if (u.hostname === 'youtu.be') return u.pathname.slice(1);
  if (u.pathname.startsWith('/shorts/') || u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
  return u.searchParams.get('v');
}

// Game art: the song's "art" image, falling back to its YouTube video's thumbnail if that fails.
function thumbFor(id) {
  const s = info[id] || {};
  const yt = s.video && youtubeId(s.video);
  return yt ? `https://i.ytimg.com/vi/${encodeURIComponent(yt)}/hqdefault.jpg` : '';
}
function artFor(id) {
  return (info[id] || {}).art || thumbFor(id);
}
window.artFailed = (img) => {
  const thumb = img.dataset.thumb;
  if (thumb && img.src !== thumb) img.src = thumb;
  else img.style.visibility = 'hidden';
};

// "Game - Song" titles from the database are split if songs.json has no game/song fields.
function names(song) {
  const s = info[song.id] || {};
  if (s.game) return { game: s.game, song: s.song || '' };
  const [game, ...rest] = song.title.split(/\s+-\s+|:\s+/);
  return { game, song: rest.join(' - ') };
}

// Turns a YouTube link (watch, youtu.be, shorts; optional t= start) into a muted looping embed.
function youtubeEmbed(link) {
  let u;
  try { u = new URL(link); } catch { return null; }
  const id = youtubeId(link);
  if (!id) return null;
  const start = parseInt(u.searchParams.get('t') || u.searchParams.get('start') || '0', 10) || 0;
  const q = new URLSearchParams({
    autoplay: 1, mute: 1, loop: 1, playlist: id, controls: 0, rel: 0,
    modestbranding: 1, playsinline: 1, iv_load_policy: 3, disablekb: 1, start,
  });
  return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?${q}`;
}

// In-between screen: media/inbetweensongs.mp4 if it exists, else media/inbetweensongs.png,
// else the BUSKERINO placeholder.
async function exists(path) {
  try { return (await fetch(path, { method: 'HEAD', cache: 'no-store' })).ok; } catch { return false; }
}
const between = document.getElementById('between');
if (await exists('media/inbetweensongs.mp4')) {
  between.innerHTML = '<video src="media/inbetweensongs.mp4" autoplay muted loop playsinline></video>';
} else if (await exists('media/inbetweensongs.png')) {
  between.innerHTML = '<img src="media/inbetweensongs.png" alt="">';
}

// Locking a song fades its video in; marking it played (or unlocking) fades back to the in-between screen.
const player = document.getElementById('player');
let playingFor; // undefined so the first call always runs
let clearTimer = null;
function showSong(song) {
  const id = song ? song.id : null;
  if (id === playingFor) return;
  playingFor = id;
  clearTimeout(clearTimer);
  const link = song && (song.video || videos[song.id]);
  if (!link) {
    player.classList.remove('on');
    between.classList.add('on');
    clearTimer = setTimeout(() => (player.innerHTML = ''), 1300); // stop the old video after the fade
    return;
  }
  const yt = youtubeEmbed(link);
  player.innerHTML = yt
    ? `<iframe src="${esc(yt)}" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`
    : `<video src="${esc(link)}" autoplay muted loop playsinline></video>`;
  player.classList.add('on');
  between.classList.remove('on');
}
showSong(null);

watchShow(async () => {
  const board = await call('get_board');
  const upNext = board.songs.filter((s) => s.id !== board.frozenId).slice(0, 3);
  document.getElementById('list').innerHTML = upNext.map((s) => {
    const n = names(s);
    const art = artFor(s.id);
    return `<li>
      ${art ? `<img class="art" src="${esc(art)}" data-thumb="${esc(thumbFor(s.id))}" alt="" onerror="artFailed(this)">` : '<div class="art"></div>'}
      <div class="text"><div class="game">${esc(n.game)}</div><div class="song">${esc(n.song)}</div></div>
    </li>`;
  }).join('');
  const frozen = board.songs.find((s) => s.id === board.frozenId);
  const now = document.getElementById('now');
  now.style.display = frozen ? 'block' : 'none';
  if (frozen) {
    const n = names(frozen);
    now.textContent = `Now playing: ${n.song ? `${n.game} - ${n.song}` : n.game}`;
  }
  showSong(frozen);
});
</script>
</body>
</html>
